name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: '0'

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_application_checks: ${{ steps.scope.outputs.run_application_checks }}
      run_upgrade_checks: ${{ steps.scope.outputs.run_upgrade_checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - id: scope
        run: node scripts/checks.mjs ci-scope >> "$GITHUB_OUTPUT"
      - run: npm ci
        if: steps.scope.outputs.run_application_checks == 'true'
      - run: node scripts/install-gitleaks.mjs
      - run: npm test
        if: steps.scope.outputs.run_application_checks == 'true'
      - run: npm run check:hygiene

  backend:
    needs: hygiene
    if: needs.hygiene.outputs.run_application_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # GitHub's Ubuntu runners provide Docker for disposable Testcontainers PostgreSQL.
      - run: npm run check:backend

  frontend:
    needs: hygiene
    if: needs.hygiene.outputs.run_application_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/PocketLedger.Web/package-lock.json
      - run: npm ci
        working-directory: src/PocketLedger.Web
      - run: npm run check:frontend

  coverage:
    needs: hygiene
    if: needs.hygiene.outputs.run_application_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # PRs compare the merge candidate to their base; main pushes compare the
      # previous main revision. Feature pushes never reach this job.
      COVERAGE_BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
      COVERAGE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: node scripts/coverage.mjs check --base "$COVERAGE_BASE" --head "$COVERAGE_HEAD"
      - name: Upload coverage and comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: .artifacts/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  authentication-e2e:
    needs: hygiene
    if: needs.hygiene.outputs.run_application_checks == 'true' || github.event_name == 'pull_request'
    strategy:
      matrix:
        realm-baseline: [current, phase1]
    env:
      E2E_REALM_BASELINE: ${{ matrix.realm-baseline }}
      RUN_AUTHENTICATION_E2E: ${{ (matrix.realm-baseline == 'current' && needs.hygiene.outputs.run_application_checks == 'true') || (matrix.realm-baseline == 'phase1' && needs.hygiene.outputs.run_upgrade_checks == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Docs-only PRs keep both required contexts; feature pushes need no runners.
      - name: Authentication suite not required
        if: env.RUN_AUTHENTICATION_E2E == 'false'
        run: echo "No relevant changes for this authentication suite."
      - uses: actions/checkout@v7
        if: env.RUN_AUTHENTICATION_E2E == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN_AUTHENTICATION_E2E == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/PocketLedger.Web/package-lock.json
            tests/PocketLedger.E2E/package-lock.json
      - uses: actions/setup-dotnet@v6
        if: env.RUN_AUTHENTICATION_E2E == 'true'
        with:
          global-json-file: global.json
      - run: npm --prefix src/PocketLedger.Web ci
        if: env.RUN_AUTHENTICATION_E2E == 'true'
      - run: npm --prefix tests/PocketLedger.E2E ci
        if: env.RUN_AUTHENTICATION_E2E == 'true'
      - run: npx --prefix tests/PocketLedger.E2E playwright install --with-deps chromium
        if: env.RUN_AUTHENTICATION_E2E == 'true'
      - run: npm run build:keycloak-provider
        if: env.RUN_AUTHENTICATION_E2E == 'true'
      - run: npm run build:keycloak-theme
        if: env.RUN_AUTHENTICATION_E2E == 'true'
      - run: npm --prefix tests/PocketLedger.E2E test
        if: env.RUN_AUTHENTICATION_E2E == 'true'
