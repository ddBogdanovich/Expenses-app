name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: '0'

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/install-gitleaks.mjs
      - run: npm test
      - run: npm run check:hygiene

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # GitHub's Ubuntu runners provide Docker for disposable Testcontainers PostgreSQL.
      - run: npm run check:backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/PocketLedger.Web/package-lock.json
      - run: npm ci
        working-directory: src/PocketLedger.Web
      - run: npm run check:frontend

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # PRs compare the tested merge candidate to the event's base. Feature pushes
      # compare fresh main; main pushes compare the previous main revision.
      COVERAGE_BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || '' }}
      COVERAGE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: node scripts/coverage.mjs check --base "$COVERAGE_BASE" --head "$COVERAGE_HEAD"
      - name: Upload coverage and comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: .artifacts/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  authentication-e2e:
    strategy:
      matrix:
        realm-baseline: [current, phase1]
    env:
      E2E_REALM_BASELINE: ${{ matrix.realm-baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/PocketLedger.Web/package-lock.json
            tests/PocketLedger.E2E/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: npm --prefix src/PocketLedger.Web ci
      - run: npm --prefix tests/PocketLedger.E2E ci
      - run: npx --prefix tests/PocketLedger.E2E playwright install --with-deps chromium
      - run: npm run build:keycloak-provider
      - run: npm run build:keycloak-theme
      - run: npm --prefix tests/PocketLedger.E2E test
