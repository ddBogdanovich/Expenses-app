name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: '0'

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/install-gitleaks.mjs
      - run: npm test
      - run: npm run check:hygiene

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # GitHub's Ubuntu runners provide Docker for disposable Testcontainers PostgreSQL.
      - run: npm run check:backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/PocketLedger.Web/package-lock.json
      - run: npm ci
        working-directory: src/PocketLedger.Web
      - run: npm run check:frontend
